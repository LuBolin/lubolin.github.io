description:
  - Team-vs-team multiplayer strategy game about two rival bee colonies competing to build a hive and win the queen's favour.
  - Gather nectar, pollen and resin through skill-based minigames, grow your economy, and send swarms to disrupt the other hive.
  - First to finish constructing their hive — and defend it — wins.
context: Made for CS4350, NUS.
